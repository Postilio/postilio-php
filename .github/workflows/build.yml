name: build

# No release workflow: Packagist reads a pushed tag through its webhook.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit hash, with the version as a comment. To bump one, look up the commit of the new tag
# (gh api repos/<owner>/<action>/commits/<tag> --jq .sha) and replace both the hash and the comment.

jobs:
  # The repository's own check: package metadata, code style, static analysis, tests, examples, package contents.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - run: ./build.sh

  # The tests and the examples on every supported PHP version, with the dependencies composer picks for it. The
  # contract tests stay out: they need a running Postilio and a test key.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    name: test (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: vendor/bin/phpunit --exclude-group contract
      - run: for example in examples/*.php; do php "$example" > /dev/null; done
